<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive visualiser for pathfinding (BFS, DFS, Dijkstra, A*, Greedy) and sorting algorithms." />
    <title>Algorithm Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='18' width='6' height='12' rx='1.5' fill='%2310b981'/><rect x='10' y='10' width='6' height='20' rx='1.5' fill='%236366f1'/><rect x='18' y='4' width='6' height='26' rx='1.5' fill='%23facc15'/><rect x='26' y='14' width='4' height='16' rx='1.5' fill='%23f43f5e'/></svg>"
    />
    <script>
      // Apply dark mode before the first render (no flash)
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
